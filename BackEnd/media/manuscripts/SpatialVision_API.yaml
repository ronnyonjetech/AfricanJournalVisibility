openapi: 3.0.3
info:
  title: SpatialVision API
  version: 1.0.0
  description: Spatial transcriptomics analysis platform API. All endpoints require
    JWT Bearer token except /auth/login/ and /auth/register/.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Get current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register a new user and organisation
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: ron@lab.edu
                password:
                  type: string
                  example: Admin1234!
                org_name:
                  type: string
                  example: My Lab
                org_slug:
                  type: string
                  example: my-lab
              required:
              - email
              - password
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                description: User created
          description: ''
  /api/billing/:
    get:
      operationId: billing_retrieve
      summary: Billing — coming soon
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/pipelines/:
    get:
      operationId: pipelines_list
      description: |-
        Create and monitor analysis pipelines.
        The frontend polls GET /api/pipelines/{id}/ every 3 seconds to get live status.
        Progress values are written by the Celery worker — not simulated.
      summary: List all pipelines for your organisation
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - pipelines
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPipelineList'
          description: ''
    post:
      operationId: pipelines_create
      description: Creates the pipeline record and immediately enqueues it to the
        Celery worker. Returns the pipeline ID — poll GET /api/pipelines/{id}/ for
        live status.
      summary: Create and queue a new pipeline
      tags:
      - pipelines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PipelineCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PipelineCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineCreate'
          description: ''
  /api/pipelines/{id}/:
    get:
      operationId: pipelines_retrieve
      description: Returns full pipeline status including progress, current step,
        logs, and results. Poll this every 3 seconds for live updates.
      summary: Get pipeline status
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pipelines
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
          description: ''
    put:
      operationId: pipelines_update
      description: |-
        Create and monitor analysis pipelines.
        The frontend polls GET /api/pipelines/{id}/ every 3 seconds to get live status.
        Progress values are written by the Celery worker — not simulated.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pipelines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pipeline'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pipeline'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Pipeline'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
          description: ''
    patch:
      operationId: pipelines_partial_update
      description: |-
        Create and monitor analysis pipelines.
        The frontend polls GET /api/pipelines/{id}/ every 3 seconds to get live status.
        Progress values are written by the Celery worker — not simulated.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pipelines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPipeline'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPipeline'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPipeline'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
          description: ''
    delete:
      operationId: pipelines_destroy
      description: |-
        Create and monitor analysis pipelines.
        The frontend polls GET /api/pipelines/{id}/ every 3 seconds to get live status.
        Progress values are written by the Celery worker — not simulated.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pipelines
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/pipelines/{id}/cancel/:
    post:
      operationId: pipelines_cancel_create
      description: |-
        Create and monitor analysis pipelines.
        The frontend polls GET /api/pipelines/{id}/ every 3 seconds to get live status.
        Progress values are written by the Celery worker — not simulated.
      summary: Cancel a running or queued pipeline
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pipelines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pipeline'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pipeline'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Pipeline'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
          description: ''
  /api/pipelines/{id}/logs/:
    get:
      operationId: pipelines_logs_retrieve
      description: Returns log lines written by the Celery worker. Use ?since=<iso_datetime>
        for incremental polling.
      summary: Get pipeline log lines
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: since
        schema:
          type: string
        description: ISO datetime — only return logs after this time
      tags:
      - pipelines
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
          description: ''
  /api/pipelines/{id}/retry/:
    post:
      operationId: pipelines_retry_create
      description: |-
        Create and monitor analysis pipelines.
        The frontend polls GET /api/pipelines/{id}/ every 3 seconds to get live status.
        Progress values are written by the Celery worker — not simulated.
      summary: Retry a failed or cancelled pipeline
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pipelines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pipeline'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pipeline'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Pipeline'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
          description: ''
  /api/pipelines/stats/:
    get:
      operationId: pipelines_stats_retrieve
      description: |-
        Create and monitor analysis pipelines.
        The frontend polls GET /api/pipelines/{id}/ every 3 seconds to get live status.
        Progress values are written by the Celery worker — not simulated.
      summary: Pipeline stats for dashboard header
      tags:
      - pipelines
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
          description: ''
  /api/samples/:
    get:
      operationId: samples_list
      description: |-
        Manage spatial transcriptomics samples.
        All operations are scoped to the authenticated user's organisation.
      summary: List all samples for your organisation
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - samples
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSampleList'
          description: ''
    post:
      operationId: samples_create
      description: |-
        Manage spatial transcriptomics samples.
        All operations are scoped to the authenticated user's organisation.
      summary: Create a new sample record
      tags:
      - samples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SampleCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SampleCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleCreate'
          description: ''
  /api/samples/{id}/:
    get:
      operationId: samples_retrieve
      description: |-
        Manage spatial transcriptomics samples.
        All operations are scoped to the authenticated user's organisation.
      summary: Get a single sample with QC metrics
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - samples
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
          description: ''
    put:
      operationId: samples_update
      description: |-
        Manage spatial transcriptomics samples.
        All operations are scoped to the authenticated user's organisation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - samples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sample'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Sample'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Sample'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
          description: ''
    patch:
      operationId: samples_partial_update
      description: |-
        Manage spatial transcriptomics samples.
        All operations are scoped to the authenticated user's organisation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - samples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSample'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSample'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSample'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
          description: ''
    delete:
      operationId: samples_destroy
      description: |-
        Manage spatial transcriptomics samples.
        All operations are scoped to the authenticated user's organisation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - samples
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/samples/{id}/complete_upload/:
    post:
      operationId: samples_complete_upload_create
      description: Finalises the multipart upload after all chunks have been uploaded.
        Triggers async conversion to h5ad format.
      summary: Complete chunked S3 upload
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - samples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sample'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Sample'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Sample'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
          description: ''
  /api/samples/{id}/initiate_upload/:
    post:
      operationId: samples_initiate_upload_create
      description: Starts a multipart upload for large files (Xenium can be 200 GB).
        Returns an upload_id and s3_key to use for subsequent chunk uploads.
      summary: Initiate chunked S3 upload
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - samples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sample'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Sample'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Sample'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
          description: ''
  /api/teams/:
    get:
      operationId: teams_retrieve
      summary: Teams — coming soon
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    FileTypeEnum:
      enum:
      - matrix
      - barcodes
      - features
      - spatial
      - image_hires
      - image_lowres
      - transcripts
      - cell_boundaries
      - metadata
      - other
      type: string
      description: |-
        * `matrix` - Count matrix
        * `barcodes` - Barcodes
        * `features` - Features/genes
        * `spatial` - Spatial coordinates
        * `image_hires` - High-res tissue image
        * `image_lowres` - Low-res tissue image
        * `transcripts` - Transcript positions
        * `cell_boundaries` - Cell boundaries
        * `metadata` - Cell metadata
        * `other` - Other
    LevelEnum:
      enum:
      - info
      - warn
      - error
      - done
      type: string
      description: |-
        * `info` - Info
        * `warn` - Warning
        * `error` - Error
        * `done` - Done
    NormalisationEnum:
      enum:
      - sctransform
      - lognorm
      - scran
      type: string
      description: |-
        * `sctransform` - SCTransform (recommended)
        * `lognorm` - Log-normalise
        * `scran` - Scran pooling
    PaginatedPipelineList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Pipeline'
    PaginatedSampleList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Sample'
    PatchedPipeline:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pipeline_type:
          $ref: '#/components/schemas/PipelineTypeEnum'
        normalisation:
          $ref: '#/components/schemas/NormalisationEnum'
        clustering_resolution:
          type: number
          format: double
        status:
          allOf:
          - $ref: '#/components/schemas/PipelineStatusEnum'
          readOnly: true
        current_step:
          type: string
          readOnly: true
        progress:
          type: number
          format: double
          readOnly: true
        step_progress:
          type: number
          format: double
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        elapsed_seconds:
          type: integer
          readOnly: true
        sample_name:
          type: string
          readOnly: true
        sample_platform:
          type: string
          readOnly: true
        report_html_key:
          type: string
          maxLength: 500
        report_pdf_key:
          type: string
          maxLength: 500
        logs:
          type: array
          items:
            $ref: '#/components/schemas/PipelineLog'
          readOnly: true
        result:
          allOf:
          - $ref: '#/components/schemas/PipelineResult'
          readOnly: true
        steps:
          type: string
          readOnly: true
    PatchedSample:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        status:
          $ref: '#/components/schemas/SampleStatusEnum'
        total_spots:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        spots_passing_qc:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        total_genes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        median_genes_per_spot:
          type: number
          format: double
          nullable: true
        median_umi_per_spot:
          type: number
          format: double
          nullable: true
        pct_mito_median:
          type: number
          format: double
          nullable: true
        file_size_gb:
          type: number
          format: double
        qc_pass_rate:
          type: number
          format: double
          readOnly: true
        tissue_image_url:
          type: string
          format: uri
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/SampleFile'
          readOnly: true
    Pipeline:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pipeline_type:
          $ref: '#/components/schemas/PipelineTypeEnum'
        normalisation:
          $ref: '#/components/schemas/NormalisationEnum'
        clustering_resolution:
          type: number
          format: double
        status:
          allOf:
          - $ref: '#/components/schemas/PipelineStatusEnum'
          readOnly: true
        current_step:
          type: string
          readOnly: true
        progress:
          type: number
          format: double
          readOnly: true
        step_progress:
          type: number
          format: double
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        elapsed_seconds:
          type: integer
          readOnly: true
        sample_name:
          type: string
          readOnly: true
        sample_platform:
          type: string
          readOnly: true
        report_html_key:
          type: string
          maxLength: 500
        report_pdf_key:
          type: string
          maxLength: 500
        logs:
          type: array
          items:
            $ref: '#/components/schemas/PipelineLog'
          readOnly: true
        result:
          allOf:
          - $ref: '#/components/schemas/PipelineResult'
          readOnly: true
        steps:
          type: string
          readOnly: true
      required:
      - completed_at
      - created_at
      - current_step
      - elapsed_seconds
      - error_message
      - id
      - logs
      - pipeline_type
      - progress
      - result
      - sample_name
      - sample_platform
      - started_at
      - status
      - step_progress
      - steps
    PipelineCreate:
      type: object
      properties:
        sample_id:
          type: string
          format: uuid
          writeOnly: true
        pipeline_type:
          $ref: '#/components/schemas/PipelineTypeEnum'
        normalisation:
          $ref: '#/components/schemas/NormalisationEnum'
        clustering_resolution:
          type: number
          format: double
        min_genes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        min_cells:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        max_pct_mito:
          type: number
          format: double
      required:
      - pipeline_type
      - sample_id
    PipelineLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        step:
          type: string
          maxLength: 30
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
    PipelineResult:
      type: object
      properties:
        n_clusters:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        cluster_summary: {}
        marker_genes: {}
        svg_genes: {}
        ai_interpretation:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
    PipelineStatusEnum:
      enum:
      - queued
      - running
      - done
      - failed
      - cancelled
      type: string
      description: |-
        * `queued` - Queued
        * `running` - Running
        * `done` - Completed
        * `failed` - Failed
        * `cancelled` - Cancelled
    PipelineTypeEnum:
      enum:
      - standard
      - deconv
      - svg_only
      - annotate_only
      type: string
      description: |-
        * `standard` - Standard QC + Leiden clustering
        * `deconv` - Full deconvolution (RCTD)
        * `svg_only` - Spatially variable genes only
        * `annotate_only` - AI annotation only
    PlatformEnum:
      enum:
      - visium
      - visium_hd
      - xenium
      - cosmx
      - merscope
      - slideseq
      - other
      type: string
      description: |-
        * `visium` - 10x Visium
        * `visium_hd` - 10x Visium HD
        * `xenium` - 10x Xenium
        * `cosmx` - NanoString CosMx
        * `merscope` - Vizgen MERSCOPE
        * `slideseq` - Slide-seq v2
        * `other` - Other
    Sample:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        status:
          $ref: '#/components/schemas/SampleStatusEnum'
        total_spots:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        spots_passing_qc:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        total_genes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        median_genes_per_spot:
          type: number
          format: double
          nullable: true
        median_umi_per_spot:
          type: number
          format: double
          nullable: true
        pct_mito_median:
          type: number
          format: double
          nullable: true
        file_size_gb:
          type: number
          format: double
        qc_pass_rate:
          type: number
          format: double
          readOnly: true
        tissue_image_url:
          type: string
          format: uri
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/SampleFile'
          readOnly: true
      required:
      - created_at
      - files
      - id
      - name
      - platform
      - qc_pass_rate
      - updated_at
    SampleCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - name
      - platform
    SampleFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        file_type:
          $ref: '#/components/schemas/FileTypeEnum'
        original_filename:
          type: string
          maxLength: 500
        file_size_bytes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        uploaded:
          type: boolean
      required:
      - file_type
      - id
      - original_filename
    SampleStatusEnum:
      enum:
      - uploading
      - uploaded
      - qc_pending
      - qc_passed
      - qc_failed
      - ready
      - error
      type: string
      description: |-
        * `uploading` - Uploading
        * `uploaded` - Uploaded
        * `qc_pending` - QC Pending
        * `qc_passed` - QC Passed
        * `qc_failed` - QC Failed
        * `ready` - Ready
        * `error` - Error
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Login, token refresh, user profile
- name: samples
  description: Upload and manage spatial data samples
- name: pipelines
  description: Run and monitor analysis pipelines
- name: teams
  description: Team members and permissions
- name: billing
  description: Subscription and invoice management
